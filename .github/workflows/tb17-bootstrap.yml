name: TB17 Release Bootstrap

on:
  push:
    branches:
      - tb17-release-upload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct TB17 patch
        shell: bash
        run: |
          cat .tb17-patch/part00 .tb17-patch/part01 .tb17-patch/part02 .tb17-patch/part03 .tb17-patch/part04a .tb17-patch/part04b .tb17-patch/part05 > /tmp/tb17.patch.xz.b64
          base64 -d /tmp/tb17.patch.xz.b64 > /tmp/tb17.patch.xz
          xz -dc /tmp/tb17.patch.xz > /tmp/tb17.patch
          patch -p1 --forward < /tmp/tb17.patch
          # The verifier's dist ignore check must address the ignored directory form.
          sed -i "s/git_is_ignored(root, 'dist')/git_is_ignored(root, 'dist\\/')/" tools/verify_repo.py
          rm -rf .tb17-patch
          rm -f .github/workflows/tb17-bootstrap.yml

      - name: Verify repository payload
        shell: bash
        run: python tools/verify_repo.py --repo-root .

      - name: Build release assets
        shell: bash
        run: python tools/build_release.py --repo-root .

      - name: Commit TB17 and fast-forward main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Unity Tool v0.5.10 TB17"
          git push origin HEAD:main

      - name: Publish TB17 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.5.10-TB17"
          TITLE="Stories OSC Unity Tool v0.5.10 TB17"
          NOTES="RELEASE_NOTES_v0.5.10-TB17.md"
          DIST="dist/$TAG"
          TARGET="$(git rev-parse HEAD)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIST"/* --clobber
            gh release edit "$TAG" --target "$TARGET" --title "$TITLE" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" "$DIST"/* --target "$TARGET" --title "$TITLE" --notes-file "$NOTES" --prerelease
          fi
