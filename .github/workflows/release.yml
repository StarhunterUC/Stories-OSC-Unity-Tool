name: Build Unity Tool Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish or update the GitHub Release after building
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository payload
        run: python tools/verify_repo.py --repo-root .

      - name: Build release assets
        run: python tools/build_release.py --repo-root .

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path("version.json").read_text(encoding="utf-8"))
          print("tag=" + data["tag"])
          print("title=Stories OSC Unity Tool v" + data["version"] + " " + data["build_number"])
          print("notes=RELEASE_NOTES_" + data["tag"] + ".md")
          print("dist=dist/" + data["tag"])
          print("prerelease=" + str(bool(data["prerelease"])).lower())
          PY

      - name: Upload built release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tag }}
          path: ${{ steps.meta.outputs.dist }}/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          NOTES="${{ steps.meta.outputs.notes }}"
          DIST="${{ steps.meta.outputs.dist }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIST"/* --clobber
            gh release edit "$TAG"               --title "$TITLE"               --notes-file "$NOTES"               --prerelease
          else
            gh release create "$TAG"               "$DIST"/*               --target "${{ github.sha }}"               --title "$TITLE"               --notes-file "$NOTES"               --prerelease
          fi
