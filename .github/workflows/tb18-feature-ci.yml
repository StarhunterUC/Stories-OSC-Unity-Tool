name: TB18 Helpful Item Feature CI

on:
  push:
    branches:
      - "tb18-helpful-item-interactions"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_tb18_feature.py
      - run: python tools/verify_repo.py --repo-root .
