name: TB16 Release Bootstrap

on:
  push:
    branches:
      - tb16-release-upload

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct clean TB16 repository
        shell: bash
        run: |
          cat .tb16-upload/part* > /tmp/tb16.b64
          base64 -d /tmp/tb16.b64 > /tmp/tb16.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/tb16.tar.xz -C .
          mkdir -p dist

      - name: Verify repository payload
        shell: bash
        run: python tools/verify_repo.py --repo-root .

      - name: Build release assets
        shell: bash
        run: python tools/build_release.py --repo-root .

      - name: Commit TB16 and fast-forward main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Unity Tool v0.5.10 TB16"
          git push origin HEAD:main

      - name: Publish TB16 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.5.10-TB16"
          TITLE="Stories OSC Unity Tool v0.5.10 TB16"
          NOTES="RELEASE_NOTES_v0.5.10-TB16.md"
          DIST="dist/$TAG"
          TARGET="$(git rev-parse HEAD)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIST"/* --clobber
            gh release edit "$TAG" --target "$TARGET" --title "$TITLE" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" "$DIST"/* --target "$TARGET" --title "$TITLE" --notes-file "$NOTES" --prerelease
          fi
